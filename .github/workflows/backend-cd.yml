name: Backend CD Pipeline (Develop to Main Merge)

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'ZipURL.Tests/**'
      - 'ZipURLSystem.sln'

jobs:
  # ===== JOB 1: TEST TRƯỚC KHI BUILD =====
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ZipURLSystem.sln

      - name: Run tests
        run: dotnet test ZipURL.Tests/ZipURL.Tests.csproj --configuration Release --verbosity normal

  # ===== JOB 2: BUILD & PUSH DOCKER IMAGES =====
  build_and_push_docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ===== BUILD IDENTITY SERVICE =====
      - name: Build and Push Identity Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/ZipURL.Services.Identity/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/zipurl-identity-service:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/zipurl-identity-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ===== BUILD SHORTER URL SERVICE =====
      - name: Build and Push ShorterURL Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/ZipURL.Services.ShorterURL/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/zipurl-shorterurl-service:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/zipurl-shorterurl-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===== JOB 3: DEPLOY TO RENDER (Production) =====
  deploy_production:
    runs-on: ubuntu-latest
    needs: build_and_push_docker
    steps:
      - name: Deploy Identity Service to Render
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_IDENTITY_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}

      - name: Deploy ShorterURL Service to Render
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_SHORTERURL_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}